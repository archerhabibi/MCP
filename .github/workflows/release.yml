name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify
        run: |
          bash -n install-server-mcp.sh
          shellcheck -S warning install-server-mcp.sh uninstall-server-mcp.sh
      - name: Checksums
        run: sha256sum install-server-mcp.sh uninstall-server-mcp.sh > SHA256SUMS
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            install-server-mcp.sh
            uninstall-server-mcp.sh
            SHA256SUMS
